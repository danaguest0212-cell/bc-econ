backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "calendar"
    label: "Course Calendar"
    files:
      - name: "calendar"
        label: "Calendar"
        file: "data/calendar.json"
        format: json
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            summary: "{{fields.date}} — {{fields.topic}}"
            fields:
              - {label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD"}
              - {label: "Topic / Lesson", name: "topic", widget: "string"}
              - {label: "Due / Homework", name: "due", widget: "string", required: false, hint: "Assignments due today, or upcoming deadlines"}
              - {label: "Notes", name: "notes", widget: "string", required: false}

  - name: "documents"
    label: "Documents"
    files:
      - name: "documents"
        label: "Course Documents"
        file: "data/documents.json"
        format: json
        fields:
          - label: "Documents"
            name: "documents"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["Syllabus", "Handout", "Assignment", "Reading", "Other"]}
              - {label: "File", name: "file", widget: "file"}
              - {label: "Description", name: "description", widget: "string", required: false}
